<!doctype html>
<html lang="es" class="alto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AH OME</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121212'/%3E%3Crect x='7' y='22' width='18' height='2' fill='%234A3428'/%3E%3Ctext x='16' y='19' font-family='Futura,Arial' font-size='11' letter-spacing='1' fill='white' text-anchor='middle'%3EAH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="estilo.css">
<script src="config.js"></script>
<script src="trabajos.js"></script>
<script src="sitio.js"></script>
</head>
<body>
<div class="visor">
  <header class="barra">
    <a class="volver" href="./" aria-label="Volver a los trabajos">←&nbsp;<span id="volver">Trabajos</span></a>
    <div class="titulo"><b id="titulo">Cargando…</b><span id="meta"></span></div>
    <div class="acciones">
      <button class="boton opcional" id="b-info" type="button">Ficha</button>
      <button class="boton" id="b-compartir" type="button">Compartir</button>
      <button class="boton" id="b-material" type="button" hidden>Material</button>
      <button class="boton lleno" id="b-completa" type="button" hidden>Ampliar</button>
    </div>
  </header>
  <div class="escena" id="escena">
    <div class="fondo-portada" id="portada" aria-hidden="true"></div>
    <form class="candado" id="candado" autocomplete="off">
      <span class="etiqueta">Modelo 3D privado</span>
      <h2 id="c-titulo"></h2>
      <p>Ingresá la clave que te enviamos para recorrer el modelo.</p>
      <div class="campo">
        <input id="clave" type="password" placeholder="Clave" aria-label="Clave del proyecto" autocapitalize="off" spellcheck="false" required>
        <button class="boton lleno" id="b-abrir" type="submit">Ver en 3D</button>
      </div>
      <div class="error" id="error" role="alert"></div>
    </form>
    <iframe id="modelo" title="Modelo 3D" allow="fullscreen" allowfullscreen hidden></iframe>
    <button class="boton salir" id="b-salir" type="button" hidden>Cerrar</button>
    <aside class="panel-mat" id="material" hidden>
      <button class="cerrar" id="m-cerrar" type="button" aria-label="Cerrar">×</button>
      <span class="etiqueta">Material para publicar</span>
      <p>Elegí la vista y el modo día o noche en el modelo, y después guardá.</p>
      <button class="boton lleno ancho" id="m-imagen" type="button">Guardar imagen</button>
      <button class="boton ancho" id="m-video" type="button">Grabar video</button>
      <small>El video graba lo que hagas en el modelo hasta que toques Detener.</small>
    </aside>
    <div class="grabando" id="grabando" hidden><span class="punto"></span><span id="g-tiempo">0:00</span><button type="button" id="g-parar">Detener y guardar</button></div>
    <aside class="ficha" id="ficha" hidden aria-live="polite">
      <button class="cerrar" id="b-cerrar" type="button" aria-label="Cerrar ficha">×</button>
      <h3 id="f-titulo"></h3><div class="meta" id="f-meta"></div><p id="f-desc"></p>
    </aside>
  </div>
</div>
<div class="aviso" id="aviso" hidden></div>
<script>
(function(){
  const S=window.SITIO||{}, $=id=>document.getElementById(id);
  const id=new URLSearchParams(location.search).get('t');
  $('volver').textContent=S.nombre||'Trabajos';
  function aviso(t){const a=$('aviso');a.textContent=t;a.hidden=false;clearTimeout(aviso.k);aviso.k=setTimeout(()=>a.hidden=true,2200);}
  const guardar=(k,v)=>{try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v);}catch(e){}};
  const leer=k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}};
  if(!id){$('titulo').textContent='Trabajo no encontrado';$('candado').hidden=true;return;}

  // clave en el enlace (…#clave=xxxx): se usa y se borra de la barra de direcciones
  let deEnlace=null;
  const h=new URLSearchParams(location.hash.slice(1)); if(h.get('clave')){deEnlace=h.get('clave');history.replaceState(null,'',location.pathname+location.search);}

  let T=null, url=null;
  Portfolio.datos(id).then(t=>{
    T=t;
    document.title=`${t.titulo} · ${S.nombre||'Trabajos'}`;
    $('titulo').textContent=t.titulo; $('meta').textContent=Portfolio.meta(t); $('c-titulo').textContent=t.titulo;
    $('f-titulo').textContent=t.titulo; $('f-meta').textContent=Portfolio.meta(t); $('f-desc').textContent=t.descripcion||'';
    if(!t.descripcion)$('b-info').hidden=true;
    // portada: la imagen del proyecto o, si no hay, la planta dibujada
    const p=$('portada'); p.innerHTML=Portfolio.planta(t.id);
    const img=new Image(); img.alt=''; img.onload=()=>{p.innerHTML='';p.appendChild(img);};
    img.src=`trabajos/${encodeURIComponent(t.id)}/${encodeURIComponent(t.portada)}`;
    const c=deEnlace||leer('clave-'+t.id);
    if(c){$('clave').value=c;entrar(c,!deEnlace);} else if(innerWidth>720) $('clave').focus();
  });

  async function entrar(clave,silencio){
    const b=$('b-abrir'); b.disabled=true; b.textContent='Abriendo…'; $('error').textContent='';
    try{
      const html=await Portfolio.abrir(T,clave);
      guardar('clave-'+T.id,clave);
      url&&URL.revokeObjectURL(url); url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
      const fr=$('modelo'); fr.src=url; fr.hidden=false;
      document.body.classList.add('abierto'); $('candado').hidden=true; $('portada').hidden=true; $('b-completa').hidden=false; $('ficha').hidden=true;
      fr.onload=()=>{ $('b-material').hidden=!modelo(); setTimeout(()=>{$('b-material').hidden=!modelo();},2500); };
    }catch(e){
      guardar('clave-'+T.id,null);
      const m=e.message;
      if(!silencio||m!=='clave') $('error').textContent= m==='clave'?'La clave no es correcta.': m==='falta'?'Este modelo todavía no está disponible.':'Este navegador no puede abrir el modelo. Probá con Chrome o Safari actualizados.';
      $('clave').select();
    }finally{b.disabled=false;b.textContent='Ver en 3D';}
  }
  $('candado').onsubmit=e=>{e.preventDefault(); const c=$('clave').value.trim(); if(c&&T) entrar(c);};

  $('b-info').onclick=()=>{$('ficha').hidden=!$('ficha').hidden;$('material').hidden=true;};
  $('b-cerrar').onclick=()=>{$('ficha').hidden=true;};
  $('b-compartir').onclick=async()=>{
    const u=location.origin+location.pathname+location.search, title=document.title;   // nunca incluye la clave
    if(navigator.share){try{await navigator.share({title,url:u});return;}catch(e){if(e&&e.name==='AbortError')return;}}
    try{await navigator.clipboard.writeText(u);aviso('Enlace copiado (sin la clave)');}catch(e){prompt('Copiá este enlace:',u);}
  };
  const pseudo=on=>{document.body.classList.toggle('completa',on);$('b-salir').hidden=!on;};
  $('b-completa').onclick=()=>{
    const el=$('escena');
    if(document.fullscreenElement){document.exitFullscreen();return;}
    if(el.requestFullscreen){el.requestFullscreen().catch(()=>pseudo(true));}
    else if(el.webkitRequestFullscreen){el.webkitRequestFullscreen();}
    else pseudo(true);   // iPhone: ocupa toda la pantalla dentro de la página
  };
  $('b-salir').onclick=()=>pseudo(false);

  // ---- material: imagen en alta y video del recorrido ----
  function modelo(){try{return $('modelo').contentWindow.AHOME||null;}catch(e){return null;}}
  const nombreArch=ext=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${T.id}-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.${ext}`;};
  function bajar(blob,nombre){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}
  $('b-material').onclick=()=>{$('material').hidden=!$('material').hidden;$('ficha').hidden=true;};
  $('m-cerrar').onclick=()=>{$('material').hidden=true;};
  $('m-imagen').onclick=async()=>{
    const M=modelo(); if(!M){aviso('El modelo todavía está cargando');return;}
    const b=$('m-imagen'); b.disabled=true; b.textContent='Guardando…';
    try{const blob=await M.capturar(innerWidth<720?2048:3200); if(!blob)throw 0; bajar(blob,nombreArch('jpg')); aviso('Imagen guardada');}
    catch(e){aviso('No se pudo guardar la imagen');}
    finally{b.disabled=false;b.textContent='Guardar imagen';}
  };
  let rec=null, partes=[], t0=0, reloj=0;
  function tipoVideo(W){const R=W.MediaRecorder; if(!R)return null;
    for(const t of ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm']) if(R.isTypeSupported&&R.isTypeSupported(t)) return t; return '';}
  $('m-video').onclick=()=>{
    const M=modelo(), W=$('modelo').contentWindow; if(!M){aviso('El modelo todavía está cargando');return;}
    const tipo=tipoVideo(W), cv=M.lienzo();
    if(tipo===null||!cv.captureStream){aviso('Este navegador no permite grabar video');return;}
    try{rec=new W.MediaRecorder(cv.captureStream(30),Object.assign({videoBitsPerSecond:8e6},tipo?{mimeType:tipo}:{}));}catch(e){aviso('Este navegador no permite grabar video');return;}
    partes=[]; rec.ondataavailable=e=>{if(e.data&&e.data.size)partes.push(e.data);};
    rec.onstop=()=>{const mt=rec.mimeType||tipo||'video/webm'; bajar(new Blob(partes,{type:mt}),nombreArch(/mp4/.test(mt)?'mp4':'webm')); aviso('Video guardado'); rec=null;};
    rec.start(1000); t0=Date.now(); $('material').hidden=true; $('grabando').hidden=false;
    reloj=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('g-tiempo').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');},500);
  };
  $('g-parar').onclick=()=>{clearInterval(reloj); $('grabando').hidden=true; $('g-tiempo').textContent='0:00'; if(rec&&rec.state!=='inactive')rec.stop();};
})();
</script>
</body>
</html>
